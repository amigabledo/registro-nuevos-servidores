    <script>
      (function() {
        // Exclusión de telemetría en rutas administrativas (/admin/*, /dashboard/*)
        if (navigator.sendBeacon) {
          var origSendBeacon = navigator.sendBeacon;
          navigator.sendBeacon = function(url) {
            var path = window.location.pathname;
            if (typeof url === 'string' && url.indexOf('cloudflareinsights') > -1 && (path.indexOf('/admin') === 0 || path.indexOf('/dashboard') === 0)) {
              return true;
            }
            return origSendBeacon.apply(navigator, arguments);
          };
        }

        // Configuración reactiva de Cloudflare Web Analytics con soporte SPA
        var cfObserver = new MutationObserver(function() {
          var scripts = document.getElementsByTagName('script');
          for (var i = 0; i < scripts.length; i++) {
            var s = scripts[i];
            if (s.src && s.src.indexOf('beacon.min.js') > -1 && s.getAttribute('data-cf-beacon')) {
              try {
                var beaconData = JSON.parse(s.getAttribute('data-cf-beacon'));
                if (!beaconData.spa) {
                  beaconData.spa = true;
                  s.setAttribute('data-cf-beacon', JSON.stringify(beaconData));
                }
              } catch (_) {}
              cfObserver.disconnect();
              break;
            }
          }
        });
        cfObserver.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
